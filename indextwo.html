<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">

<body>
    <script>
    var mes = parseInt(prompt("Digite o número do mês (1 a 12):"));

switch (mes) {
  case 2:
    alert("O mês tem 28 dias.");
    break;
  case 4:
  case 6:
  case 9:
  case 11:
    alert("O mês tem 30 dias.");
    break;
  case 1:
  case 3:
  case 5:
  case 7:
  case 8:
  case 10:
  case 12:
    alert("O mês tem 31 dias.");
    break;
  default:
    alert(" Número do Mês invalido");
}



























    </script>
</body>
</html>
