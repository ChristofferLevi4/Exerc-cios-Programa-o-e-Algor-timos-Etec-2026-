<!DOCTYPE html>
<html lang="br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var mes = parseInt(prompt("Insira o mês"))
        var dia = parseInt(prompt("insira o dia"))
        switch (mes){
        case 4:
            if(dia<=20)
                document.write(" Seu signo é Áries")
            else
                document.write(" Seu signo é Touro")
            break
        case 5:
            if(dia<=20)
                document.write(" Seu signo é Touro")
            else
                document.write(" Seu signo é Gêmeos")
            break
        case 6:
            if(dia<=20)
                 document.write(" Seu signo é Gêmeos")
            else
                 document.write(" Seu signo é Câncer")
            break
        case 7:
            if(dia<=22)
                document.write(" Seu signo é Câncer")
            else
                 document.write(" Seu signo é Leão")
            break
        case 8:
            if(dia<=22)
                 document.write(" Seu signo é Leão")
            else
                 document.write(" Seu signo é Virgem")
            break
        case 9:
            if(dia<=22)
                 document.write(" Seu signo é Virgem")
            else
                 document.write(" Seu signo é Libra")
            break
        case 10:
            if(dia<=22)
                 document.write(" Seu signo é Libra")
            else
                 document.write(" Seu signo Escorpião")
            break
        case 11:
            if(dia<=21)
                 document.write(" Seu signo é Escorpião")
            else
                 document.write(" Seu signo é Sagitário")
            break
        case 12:
            if(dia<=21)
                 document.write(" Seu signo é Sagitário")
            else
                 document.write(" Seu signo é Capricórnio")
            break
        case 1:
            if(dia<=20)
                 document.write(" Seu signo é Capricórnio")
            else
                 document.write(" Seu signo é Áquario")
            break
        case 2:
            if(dia<=19)
                 document.write(" Seu signo é Áquario")
            else
                 document.write(" Seu signo é Peixes")
            break
        case 3:
            if(dia<=20)
                 document.write(" Seu signo é Peixes")
            else
                 document.write(" Seu signo é Áries")
            break
            default:
                 document.write("mês inválido")
        }
    </script>  
</body>
</html>
